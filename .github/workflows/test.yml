name: Tests

# 수집 스크립트의 검증 로직(분류·제목 추출·LLM 출력 검증·후보 선별) 단위 테스트.
# 네트워크·API 키 없이 돌아가므로 모든 푸시와 PR에서 실행한다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
