name: Update live data

# 1시간마다 GDELT 사건 파일을 받아 Gemini로 정리하고 live-data.js 를 갱신한다.
# 변경이 있으면 커밋 → Vercel(Git 연결)이 자동으로 다시 배포한다.
on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (정각 혼잡 시간 회피)
  workflow_dispatch: {}     # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: update-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GDELT and summarize with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_live.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- live-data.js; then
            echo "변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-data.js
          git commit -m "Update live data ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git push
